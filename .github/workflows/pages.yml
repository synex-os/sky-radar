# Собирает сайт и кладёт рядом свежие орбиты спутников с CelesTrak.
# Запускается при каждом изменении в main и раз в 6 часов по расписанию.
# Браузеру так проще: орбиты лежат на нашем же сайте, а CelesTrak не дёргают тысячи раз.
name: Сайт и свежие орбиты

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - name: Собрать index.html
        run: |
          python3 build.py
          mkdir -p _site/data
          cp index.html _site/
          touch _site/.nojekyll

      - name: Скачать орбиты
        # Орбиты с CelesTrak. Не вышло — берём прошлую копию с нашего же сайта; для МКС, Тяньгуна и Хаббла есть запасной сервис.
        run: |
          site="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data"
          for g in visual stations starlink; do
            f="_site/data/$g.tle"
            # CelesTrak принимает соединения через раз (бывает, подключение длится полминуты) — пробуем настойчиво
            if curl -fsS -4 --connect-timeout 45 --max-time 240 --retry 4 --retry-all-errors --retry-delay 10 \
                 -A "sky-radar (github.com/${{ github.repository }})" \
                 "https://celestrak.org/NORAD/elements/gp.php?GROUP=$g&FORMAT=tle" -o "$f" 2>/tmp/err && grep -q '^1 ' "$f"; then
              echo "::notice::$g: $(grep -c '^1 ' $f) орбит с CelesTrak"
            elif why="$(tail -c 200 /tmp/err | tr '\n' ' ') $(head -c 120 "$f" 2>/dev/null | tr '\n' ' ')" \
                 && curl -fsS --connect-timeout 15 --max-time 60 "$site/$g.tle" -o "$f" && grep -q '^1 ' "$f"; then
              echo "::warning::$g: CelesTrak не ответил, оставляю прошлую копию с сайта"
            elif [ "$g" = stations ]; then
              : > "$f"
              for id in 25544 48274 20580; do
                curl -fsS --connect-timeout 15 --max-time 30 "https://tle.ivanstanojevic.me/api/tle/$id" \
                  | python3 -c 'import json,sys; j=json.load(sys.stdin); print(j["name"]); print(j["line1"]); print(j["line2"])' >> "$f" || true
              done
              if grep -q '^1 ' "$f"; then echo "::warning::stations: CelesTrak не ответил, $(grep -c '^1 ' $f) орбиты из запасного сервиса"
              else rm -f "$f"; echo "::warning::stations: орбит нет ни из одного источника ($why)"; fi
            else
              rm -f "$f"
              echo "::warning::$g: орбит нет ($why), браузер попробует CelesTrak сам"
            fi
          done

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
