# Разведка источников самолётов: запускается при правке этого файла, ничего не выкладывает
name: Разведка источников самолётов
on:
  push:
    paths: [.github/workflows/probe.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Проверить источники ADS-B
        run: |
          probe() {
            local name="$1" url="$2"
            r=$(curl -sSL -m 30 -D /tmp/h -o /tmp/b -w '%{http_code} %{size_download}B %{time_total}s' -H "Origin: https://synex-os.github.io" "$url" 2>&1 || true)
            cors=$(tr -d '\r' < /tmp/h 2>/dev/null | grep -i '^access-control-allow-origin' | cut -d' ' -f2)
            info=$(python3 - <<'PY' 2>&1 | tail -1
          import json
          d = json.load(open('/tmp/b'))
          ac = d.get('ac') or d.get('aircraft') or d.get('states') or []
          first = ac[0] if ac else None
          print(f"самолётов {len(ac)}, ключи верхнего уровня {list(d.keys())[:12]}, первый: {json.dumps(first, ensure_ascii=False)[:900]}")
          PY
            )
            echo "::notice::$name → $r, CORS=${cors:-нет} | $info"
          }
          probe adsb.lol "https://api.adsb.lol/v2/point/32.33/34.86/60"
          probe adsb.fi "https://opendata.adsb.fi/api/v2/lat/32.33/lon/34.86/dist/60"
          probe airplanes.live "https://api.airplanes.live/v2/point/32.33/34.86/60"
          probe opensky "https://opensky-network.org/api/states/all?lamin=31.3&lamax=33.3&lomin=33.7&lomax=36.0"
          sleep 2
          for u in "https://api.adsb.lol/v2/point/32.33/34.86/60" "https://api.airplanes.live/v2/point/32.33/34.86/60" "https://opendata.adsb.fi/api/v2/lat/32.33/lon/34.86/dist/60"; do
            echo "::notice::заголовки $u: $(curl -sS -m 20 -o /dev/null -D - -H 'Origin: https://synex-os.github.io' "$u" | tr -d '\r' | grep -iE '^(access-control|cache-control|x-ratelimit|retry-after|server)' | tr '\n' ' ')"
          done
