# Разведка справочников маршрутов: запускается при правке этого файла, ничего не выкладывает
name: Разведка маршрутов рейсов
on:
  push:
    paths: [.github/workflows/probe.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Проверить справочники маршрутов
        run: |
          O="Origin: https://synex-os.github.io"
          for c in ELY2366 RYR81KL WZZ4321 ISR722; do
            r=$(curl -sS -m 20 -D /tmp/h -o /tmp/b -w '%{http_code}' -H "$O" "https://api.adsbdb.com/v0/callsign/$c" 2>&1 || true)
            echo "::notice::adsbdb $c → $r CORS=$(tr -d '\r' < /tmp/h | grep -i '^access-control-allow-origin' | cut -d' ' -f2) $(head -c 700 /tmp/b | tr '\n' ' ')"
          done
          r=$(curl -sS -m 20 -D /tmp/h -o /tmp/b -w '%{http_code}' -H "$O" -H 'Content-Type: application/json' \
            -d '{"planes":[{"callsign":"ELY2366","lat":32.4,"lng":34.0},{"callsign":"RYR81KL","lat":32.2,"lng":34.9}]}' \
            "https://api.adsb.lol/api/0/routeset" 2>&1 || true)
          echo "::notice::adsb.lol routeset → $r CORS=$(tr -d '\r' < /tmp/h | grep -i '^access-control-allow-origin' | cut -d' ' -f2) $(head -c 900 /tmp/b | tr '\n' ' ')"
          r=$(curl -sS -m 20 -X OPTIONS -D - -o /dev/null -H "$O" -H 'Access-Control-Request-Method: POST' -H 'Access-Control-Request-Headers: content-type' "https://api.adsb.lol/api/0/routeset" 2>&1 | tr -d '\r' | grep -iE '^(HTTP|access-control)' | tr '\n' ' ')
          echo "::notice::adsb.lol routeset preflight → $r"
