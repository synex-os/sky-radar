# Разведка источников орбит: запускается при правке этого файла, ничего не выкладывает
name: Разведка источников орбит
on:
  workflow_dispatch:
  push:
    paths: [.github/workflows/probe.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Проверить источники
        run: |
          probe() {
            local name="$1" url="$2"
            local out; out=$(curl -sSL -m 40 -D /tmp/h -o /tmp/b -w '%{http_code} %{size_download}B %{time_total}s %{url_effective}' -H "Origin: https://synex-os.github.io" "$url" 2>&1 || true)
            local cors; cors=$(tr -d '\r' < /tmp/h 2>/dev/null | grep -i '^access-control-allow-origin' | cut -d' ' -f2)
            local tle; tle=$(grep -c '^1 ' /tmp/b 2>/dev/null || echo 0)
            echo "::notice::$name → $out, CORS=${cors:-нет}, TLE-строк=$tle, начало: $(head -c 160 /tmp/b 2>/dev/null | tr '\n\r' '  ')"
          }
          UA="Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Mobile Safari/537.36"
          for u in "https://celestrak.org/NORAD/elements/gp.php?CATNR=25544&FORMAT=tle" "https://celestrak.org/NORAD/elements/gp.php?GROUP=visual&FORMAT=tle" "https://celestrak.org/NORAD/elements/gp.php?GROUP=visual&FORMAT=json"; do
            r=$(curl -sS -m 40 -A "$UA" -o /tmp/b -w '%{http_code} %{size_download}B connect=%{time_connect}s total=%{time_total}s' "$u" 2>&1 || true)
            echo "::notice::browserUA $u → $r, TLE=$(grep -c '^1 ' /tmp/b 2>/dev/null || echo 0), начало: $(head -c 120 /tmp/b 2>/dev/null | tr '\n\r' '  ')"
            r=$(curl -sS -m 40 -o /tmp/b -w '%{http_code} %{size_download}B connect=%{time_connect}s total=%{time_total}s' "$u" 2>&1 || true)
            echo "::notice::curlUA $u → $r"
          done
          for q in "STARLINK&page-size=100&page=2" "SL-16&page-size=100" "R%2FB&page-size=100"; do
            r=$(curl -sSL -m 60 -o /tmp/iv.json -w '%{http_code} total=%{time_total}s' "https://tle.ivanstanojevic.me/api/tle/?search=$q" 2>&1 || true)
            echo "::notice::ivan $q → $r, $(python3 -c "import json; d=json.load(open('/tmp/iv.json')); m=d.get('member',[]); print('total', d.get('totalItems'), 'пример', [x['name'] for x in m[:4]], 'даты', sorted(x['date'][:10] for x in m)[:1], sorted(x['date'][:10] for x in m)[-1:])" 2>&1 | tail -1)"
          done
